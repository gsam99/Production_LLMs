<svg viewBox="0 0 800 760" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" role="img">
  <title>LLM Production API — System Architecture</title>
  <desc>Vertical pipeline flow: Client → Rate Limiter → Security Check → Cache Lookup → Intent Detection → Model Router → Call LLM → Output Validator → Save to Cache → Response to Client</desc>

  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#57606a"/>
    </marker>
    <marker id="a-blue" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#0969da"/>
    </marker>
    <marker id="a-green" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#1a7f37"/>
    </marker>
    <marker id="a-red" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#cf222e"/>
    </marker>
  </defs>

  <rect width="800" height="760" fill="white"/>

  <text x="400" y="28" text-anchor="middle" fill="#24292f" font-size="15" font-weight="700">LLM Production API — System Architecture</text>

  <rect x="20" y="50" width="90" height="48" rx="8" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
  <text x="65" y="70" text-anchor="middle" fill="#0969da" font-size="11" font-weight="600">CLIENT</text>
  <text x="65" y="84" text-anchor="middle" fill="#57606a" font-size="10">Chat UI · /chat</text>

  <line x1="110" y1="74" x2="128" y2="74" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="130" y="50" width="118" height="48" rx="8" fill="#f6f8fa" stroke="#9a6700" stroke-width="1.5"/>
  <text x="189" y="70" text-anchor="middle" fill="#9a6700" font-size="11" font-weight="600">RATE LIMITER</text>
  <text x="189" y="84" text-anchor="middle" fill="#57606a" font-size="10">20 req / min · slowapi</text>

  <path d="M248,74 L400,74 L400,130" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="294" y="108" width="212" height="522" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="400" y="122" text-anchor="middle" fill="#8c959f" font-size="9" font-weight="600" letter-spacing="1.5">LANGGRAPH PIPELINE</text>

  <rect x="310" y="130" width="180" height="52" rx="7" fill="white" stroke="#cf222e" stroke-width="1.5"/>
  <text x="400" y="151" text-anchor="middle" fill="#cf222e" font-size="11" font-weight="600">SECURITY CHECK</text>
  <text x="400" y="166" text-anchor="middle" fill="#57606a" font-size="10">Prompt injection · PII masking</text>
  <line x1="490" y1="156" x2="538" y2="156" stroke="#cf222e" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#a-red)"/>
  <text x="543" y="152" fill="#cf222e" font-size="10" font-weight="500">→ 400 Blocked</text>
  <line x1="400" y1="182" x2="400" y2="200" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="310" y="202" width="180" height="52" rx="7" fill="white" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="400" y="223" text-anchor="middle" fill="#1a7f37" font-size="11" font-weight="600">CACHE LOOKUP</text>
  <text x="400" y="238" text-anchor="middle" fill="#57606a" font-size="10">Redis (exact) · ChromaDB (semantic)</text>
  <line x1="490" y1="228" x2="538" y2="228" stroke="#1a7f37" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#a-green)"/>
  <text x="543" y="224" fill="#1a7f37" font-size="10" font-weight="500">⚡ Cache Hit</text>
  <text x="543" y="236" fill="#1a7f37" font-size="9">→ Response</text>
  <line x1="400" y1="254" x2="400" y2="272" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="310" y="274" width="180" height="52" rx="7" fill="white" stroke="#8250df" stroke-width="1.5"/>
  <text x="400" y="295" text-anchor="middle" fill="#8250df" font-size="11" font-weight="600">INTENT DETECTION</text>
  <text x="400" y="310" text-anchor="middle" fill="#57606a" font-size="10">5 categories · gpt-4o-mini</text>
  <line x1="400" y1="326" x2="400" y2="344" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="310" y="346" width="180" height="60" rx="7" fill="white" stroke="#9a6700" stroke-width="1.5"/>
  <text x="400" y="366" text-anchor="middle" fill="#9a6700" font-size="11" font-weight="600">MODEL ROUTER</text>
  <text x="400" y="381" text-anchor="middle" fill="#57606a" font-size="10">Simple → gpt-4o-mini</text>
  <text x="400" y="395" text-anchor="middle" fill="#57606a" font-size="10">Complex → Claude Sonnet</text>
  <line x1="400" y1="406" x2="400" y2="424" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="310" y="426" width="180" height="60" rx="7" fill="white" stroke="#0969da" stroke-width="1.5"/>
  <text x="400" y="446" text-anchor="middle" fill="#0969da" font-size="11" font-weight="600">CALL LLM</text>
  <text x="400" y="461" text-anchor="middle" fill="#57606a" font-size="10">Primary: gpt-4o-mini</text>
  <text x="400" y="475" text-anchor="middle" fill="#57606a" font-size="10">Fallback: Claude Sonnet</text>
  <line x1="400" y1="486" x2="400" y2="504" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="310" y="506" width="180" height="52" rx="7" fill="white" stroke="#cf222e" stroke-width="1.5"/>
  <text x="400" y="527" text-anchor="middle" fill="#cf222e" font-size="11" font-weight="600">OUTPUT VALIDATOR</text>
  <text x="400" y="542" text-anchor="middle" fill="#57606a" font-size="10">PII scan · Harmful content filter</text>
  <line x1="400" y1="558" x2="400" y2="576" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="310" y="578" width="180" height="52" rx="7" fill="white" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="400" y="599" text-anchor="middle" fill="#1a7f37" font-size="11" font-weight="600">SAVE TO CACHE</text>
  <text x="400" y="614" text-anchor="middle" fill="#57606a" font-size="10">Redis + ChromaDB embeddings</text>

  <path d="M400,630 L400,652 L65,652 L65,98" fill="none" stroke="#0969da" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#a-blue)"/>
  <text x="232" y="646" text-anchor="middle" fill="#0969da" font-size="10" font-weight="500">Response to Client</text>

  <rect x="20" y="672" width="760" height="72" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="400" y="687" text-anchor="middle" fill="#8c959f" font-size="9" font-weight="600" letter-spacing="1.5">INFRASTRUCTURE</text>

  <rect x="35" y="694" width="100" height="40" rx="5" fill="white" stroke="#cf222e" stroke-width="1"/>
  <text x="85" y="711" text-anchor="middle" fill="#cf222e" font-size="10" font-weight="600">Upstash Redis</text>
  <text x="85" y="726" text-anchor="middle" fill="#8c959f" font-size="9">Exact cache · TTL 5m</text>

  <rect x="148" y="694" width="108" height="40" rx="5" fill="white" stroke="#1a7f37" stroke-width="1"/>
  <text x="202" y="711" text-anchor="middle" fill="#1a7f37" font-size="10" font-weight="600">ChromaDB</text>
  <text x="202" y="726" text-anchor="middle" fill="#8c959f" font-size="9">Semantic cache</text>

  <rect x="269" y="694" width="118" height="40" rx="5" fill="white" stroke="#9a6700" stroke-width="1"/>
  <text x="328" y="711" text-anchor="middle" fill="#9a6700" font-size="10" font-weight="600">AWS DynamoDB</text>
  <text x="328" y="726" text-anchor="middle" fill="#8c959f" font-size="9">Conversation memory</text>

  <rect x="400" y="694" width="118" height="40" rx="5" fill="white" stroke="#9a6700" stroke-width="1"/>
  <text x="459" y="711" text-anchor="middle" fill="#9a6700" font-size="10" font-weight="600">AWS Secrets Mgr</text>
  <text x="459" y="726" text-anchor="middle" fill="#8c959f" font-size="9">Zero secrets in code</text>

  <rect x="531" y="694" width="100" height="40" rx="5" fill="white" stroke="#8250df" stroke-width="1"/>
  <text x="581" y="711" text-anchor="middle" fill="#8250df" font-size="10" font-weight="600">LangSmith</text>
  <text x="581" y="726" text-anchor="middle" fill="#8c959f" font-size="9">LLM tracing</text>

  <rect x="644" y="694" width="128" height="40" rx="5" fill="white" stroke="#0969da" stroke-width="1"/>
  <text x="708" y="711" text-anchor="middle" fill="#0969da" font-size="10" font-weight="600">Docker Hub · Render</text>
  <text x="708" y="726" text-anchor="middle" fill="#8c959f" font-size="9">Containerized deploy</text>
</svg>
